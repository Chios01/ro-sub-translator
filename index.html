<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurare - RO Sub Translator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #00e676;
            text-align: center;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #a0a0a0;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .key-container {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #b0b0b0;
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #1e1e1e;
            color: #fff;
            box-sizing: border-box;
            font-family: monospace;
        }
        input:focus {
            outline: none;
            border-color: #00e676;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #00e676;
            color: #121212;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #00c853;
        }
        .hacker-status {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1>RO Sub Translator</h1>
    <p class="subtitle">Introdu cele 10 chei API Google Gemini</p>
    
    <div id="keys-form">
        <div class="key-container"><label>Cheia 1:</label><input type="text" class="api-key" placeholder="AIzaSy..."></div>
        <div class="key-container"><label>Cheia 2:</label><input type="text" class="api-key" placeholder="AIzaSy..."></div>
        <div class="key-container"><label>Cheia 3:</label><input type="text" class="api-key" placeholder="AIzaSy..."></div>
        <div class="key-container"><label>Cheia 4:</label><input type="text" class="api-key" placeholder="AIzaSy..."></div>
        <div class="key-container"><label>Cheia 5:</label><input type="text" class="api-key" placeholder="AIzaSy..."></div>
        <div class="key-container"><label>Cheia 6:</label><input type="text" class="api-key" placeholder="AIzaSy..."></div>
        <div class="key-container"><label>Cheia 7:</label><input type="text" class="api-key" placeholder="AIzaSy..."></div>
        <div class="key-container"><label>Cheia 8:</label><input type="text" class="api-key" placeholder="AIzaSy..."></div>
        <div class="key-container"><label>Cheia 9:</label><input type="text" class="api-key" placeholder="AIzaSy..."></div>
        <div class="key-container"><label>Cheia 10:</label><input type="text" class="api-key" placeholder="AIzaSy..."></div>
    </div>

    <button onclick="installAddon()">Instalează în Stremio</button>

    <div class="hacker-status">
        <p style="color: #00f7ff; font-family: 'Courier New', monospace; text-shadow: 0 0 5px #00f7ff;">
          // System status: Operational. Powered by Chios.
        </p>
    </div>

    <script>
        function installAddon() {
            const inputs = document.querySelectorAll('.api-key');
            const keys = [];
            
            inputs.forEach(input => {
                const val = input.value.trim();
                if (val) keys.push(val);
            });

            if (keys.length === 0) {
                alert('Te rog introdu măcar o cheie API!');
                return;
            }

            const configString = JSON.stringify(keys);
            const configBase64 = btoa(configString);
            
            const host = window.location.host;
            const protocol = window.location.protocol === 'https:' ? 'https://' : 'http://';
            const manifestUrl = `${protocol}${host}/${configBase64}/manifest.json`;
            
            const stremioUrl = manifestUrl.replace('https://', 'stremio://').replace('http://', 'stremio://');
            window.location.href = stremioUrl;
        }
    </script>
</body>
</html>
