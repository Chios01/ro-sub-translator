<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurare RO Sub Translator</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #141414; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            margin: 0;
        }
        .container { 
            max-width: 600px; 
            width: 100%; 
            background: #242424; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }
        h1 { 
            text-align: center; 
            color: #8a2be2; 
            margin-bottom: 5px;
        }
        .description {
            text-align: center;
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .key-group { margin-bottom: 25px; }
        .key-group h3 {
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            color: #e0e0e0;
        }
        .optional-title { color: #888 !important; }
        label { 
            display: block; 
            margin-bottom: 6px; 
            font-size: 13px; 
            color: #ccc;
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 12px; 
            border: 1px solid #444; 
            border-radius: 6px; 
            background: #1e1e1e; 
            color: #fff; 
            box-sizing: border-box; 
            font-family: monospace;
        }
        input:focus {
            outline: none;
            border-color: #8a2be2;
        }
        .btn { 
            display: block; 
            width: 100%; 
            padding: 16px; 
            background: #8a2be2; 
            color: #fff; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            transition: background 0.2s;
        }
        .btn:hover { background: #6a1b9a; }
        .signature {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #666;
            border-top: 1px solid #333;
            padding-top: 15px;
        }
        .signature span {
            color: #8a2be2;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RO Sub Translator (AI)</h1>
        <div class="description">
            Introduceți cheile API Google Gemini.<br> 
            Primele 10 sunt <b>obligatorii</b> pentru o funcționare stabilă.<br> 
            Adăugarea a 20 de chei activează automat <b>Modul Turbo</b>.
        </div>
        
        <form id="configForm">
            <div class="key-group" id="mandatoryKeys">
                <h3>Chei Obligatorii (1 - 10)</h3>
                <!-- Scriptul JS de mai jos va genera căsuțele -->
            </div>

            <div class="key-group" id="optionalKeys">
                <h3 class="optional-title">Chei Opționale (11 - 20)</h3>
            </div>

            <button type="submit" class="btn">Instalează în Stremio</button>
        </form>

        <div class="signature">
            Creat cu ❤️ de <span>Chios01</span>
        </div>
    </div>

    <script>
        // Generăm cele 10 căsuțe obligatorii
        const mandatoryContainer = document.getElementById('mandatoryKeys');
        for(let i = 1; i <= 10; i++) {
            mandatoryContainer.innerHTML += `
                <label>Cheia API ${i} *</label>
                <input type="text" id="key${i}" required placeholder="AIzaSy...">
            `;
        }

        // Generăm cele 10 căsuțe opționale
        const optionalContainer = document.getElementById('optionalKeys');
        for(let i = 11; i <= 20; i++) {
            optionalContainer.innerHTML += `
                <label>Cheia API ${i} (Opțional)</label>
                <input type="text" id="key${i}" placeholder="AIzaSy...">
            `;
        }

        // Funcția de capturare a datelor și trimitere către Stremio
        document.getElementById('configForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let keys = [];
            for(let i = 1; i <= 20; i++) {
                let val = document.getElementById('key' + i).value.trim();
                if(val !== '') {
                    keys.push(val);
                }
            }
            
            let configData = btoa(JSON.stringify(keys));
            let currentUrl = window.location.href.replace(/\/$/, "");
            let stremioUrl = currentUrl.replace('https://', 'stremio://').replace('http://', 'stremio://') + '/' + configData + '/manifest.json';
            
            window.location.href = stremioUrl;
        });
    </script>
</body>
</html>
